
name: LaTeX to PDF and Commit

on:
  push:
    branches: [main, master]
    paths:
      - '**/*.tex'
      - '.github/workflows/latex.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Compile LaTeX with XeLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          latexmk_use_xelatex: true
          args: -pdfxe -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Verify PDF
        run: |
          test -s cv.pdf || {
            echo "::error::cv.pdf was not generated"
            exit 1
          }

      - name: Commit compiled PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cv.pdf

          if git diff --cached --quiet; then
            echo "PDF unchanged; nothing to commit."
            exit 0
          fi

          git commit -m "docs: update compiled CV [skip ci]"
          git push
